<!DOCTYPE html>
<html lang="en" data-theme="auto" data-density="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>llm usage</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>">
<link rel="stylesheet" href="app.css">
<script>
  // Stamp preferences before first paint so the page never flashes the wrong
  // theme. ?theme= and ?density= pin a mode for this load without saving it —
  // handy when the dashboard is launched into a fixed panel.
  (function () {
    var el = document.documentElement;
    try {
      var saved = JSON.parse(localStorage.getItem('llm-usage.prefs') || '{}');
      if (saved.theme) el.dataset.theme = saved.theme;
      if (saved.density) el.dataset.density = saved.density;
    } catch (e) { /* private mode */ }
    var query = new URLSearchParams(location.search);
    if (/^(auto|dark|light)$/.test(query.get('theme'))) el.dataset.theme = query.get('theme');
    if (/^(auto|dense)$/.test(query.get('density'))) el.dataset.density = query.get('density');
  })();
</script>
</head>
<body>
<div class="app" id="app">

  <header class="bar">
    <h1 class="brand">
      <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
      <span class="brand-name">llm usage</span>
    </h1>

    <p class="freshness" id="freshness" aria-live="polite">Loading</p>

    <div class="bar-actions">
      <button type="button" class="btn" id="sortBtn" aria-label="Sort by urgency" title="Sort (s)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11M4 13.5 1.75 11M4 2.5 6.25 5"/><path d="M9 4h6M9 8h4.5M9 12h3"/></svg>
        <span class="btn-label" id="sortLabel">Urgency</span>
      </button>
      <button type="button" class="btn" id="densityBtn" aria-label="Toggle density" title="Density (d)">
        <svg viewBox="0 0 16 16" aria-hidden="true" class="ico-comfy"><rect x="1.5" y="2.5" width="13" height="4.5" rx="1.5"/><rect x="1.5" y="9" width="13" height="4.5" rx="1.5"/></svg>
        <svg viewBox="0 0 16 16" aria-hidden="true" class="ico-dense"><path d="M1.5 3h13M1.5 6.5h13M1.5 10h13M1.5 13.5h13"/></svg>
      </button>
      <button type="button" class="btn" id="themeBtn" aria-label="Switch theme" title="Theme (t)">
        <svg viewBox="0 0 16 16" aria-hidden="true" class="ico-dark"><path d="M13.5 9.6A6 6 0 1 1 6.4 2.5a4.8 4.8 0 0 0 7.1 7.1Z"/></svg>
        <svg viewBox="0 0 16 16" aria-hidden="true" class="ico-light"><circle cx="8" cy="8" r="3.1"/><path d="M8 .8v1.9M8 13.3v1.9M15.2 8h-1.9M2.7 8H.8M13.1 13.1l-1.4-1.4M4.3 4.3 2.9 2.9M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4"/></svg>
        <svg viewBox="0 0 16 16" aria-hidden="true" class="ico-auto"><circle cx="8" cy="8" r="6.2"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4Z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" class="btn btn-go" id="refreshBtn" aria-label="Refresh now" title="Refresh (r)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8a6 6 0 1 1-1.8-4.3"/><path d="M14.2 1.4v3.2h-3.2"/></svg>
      </button>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Provider filter" hidden></nav>

  <main class="main" id="main">
    <div class="banner" id="banner" hidden></div>
    <section class="hero" id="hero" hidden aria-label="Tightest limit"></section>
    <div class="grid" id="grid"></div>
    <div class="blank" id="blank" hidden></div>
  </main>
</div>

<template id="tpl-card">
  <article class="card">
    <header class="card-head">
      <span class="dot" aria-hidden="true"></span>
      <span class="card-name"></span>
      <span class="card-account"></span>
      <span class="chip"></span>
    </header>
    <div class="card-body"></div>
  </article>
</template>

<template id="tpl-window">
  <div class="win">
    <div class="win-top">
      <span class="win-label"></span>
      <span class="win-inline"></span>
      <span class="win-pct"></span>
    </div>
    <div class="meter">
      <div class="meter-fill"></div>
      <div class="meter-pace" hidden></div>
    </div>
    <div class="win-foot">
      <span class="win-amounts"></span>
      <span class="win-reset"></span>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
